[package]
name = "cmdpal-rs"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.8", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
] }
fuzzy-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
walkdir = "2.5"
urlencoding = "2.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.8"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
