name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build cmdpal-rs (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Registry and Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Bundle (Exe + Config + Extensions Guide)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist/extensions | Out-Null
          Copy-Item target/release/cmdpal-rs.exe dist/cmdpal-rs.exe
          Copy-Item config.toml dist/config.toml
          if (Test-Path EXTENSIONS_GUIDE.md) {
            Copy-Item EXTENSIONS_GUIDE.md dist/EXTENSIONS_GUIDE.md
          }

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmdpal-rs-windows-x64
          path: dist/
          if-no-files-found: error
